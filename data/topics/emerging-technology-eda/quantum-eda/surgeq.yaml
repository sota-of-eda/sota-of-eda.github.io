compare_when:
- evaluating crosstalk-aware quantum circuit execution on superconducting processors
- comparing hardware/software co-design methods that tune two-qubit gate coupling strength and scheduling for fidelity/runtime tradeoffs
benchmark_scope:
- 127 quantum benchmarks across 17 real-world-inspired circuit families plus QSIH stress tests
- 127-qubit heavy-hex and 225-qubit grid superconducting backend models with tunable-coupler physical parameters
- comparisons against Qiskit optimization level 3, XtalkSched, and CAMEL for depth, duration, and fidelity ratios
