description: Automated synthesis, sizing, topology selection, or optimization of analog and mixed-signal circuits, including power management, RF/analog blocks, and circuit-level design automation prior to or coupled with layout.
review_triggers:
- paper claims automated analog circuit sizing or optimization
- paper evaluates SPICE-in-the-loop analog design optimization on amplifiers, LDOs, ADCs, PLLs, or RF blocks
- paper compares against Bayesian optimization, reinforcement learning, evolutionary, or human-guided analog sizing baselines
- paper claims analog circuit sizing or synthesis improvement
- paper addresses variation-aware or PVT-robust analog sizing
- paper proposes LLM-assisted or learning-based analog circuit design
- paper covers RF IC synthesis or RF-specific layout automation
- paper claims automated analog, mixed-signal, RF, or power-management circuit generation or sizing
- experiments compare against BO, RL, surrogate models, manual design, or prior AMS automation flows
- metrics include specification success rate, power/area/noise/performance, simulation count, runtime, or design-space coverage
