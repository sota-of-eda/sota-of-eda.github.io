description: Methods for automatically generating, optimizing, or co-optimizing standard-cell or custom-cell implementations, including transistor placement/routing, cell-library generation, cell merging, pin access, and layout-rule-aware cell optimization.
review_triggers:
- paper claims automated standard-cell library generation
- paper addresses cell-level logic synthesis or transistor sizing
- paper proposes cell topology exploration or optimization
- paper generates or optimizes standard-cell, custom-cell, or margin-free cell layouts rather than only Boolean logic networks
- experiments report cell area, CPP, pin accessibility, DRC/LVS/PEX, timing/power characterization, or integration with physical design flows
- baselines include SMT/DP/heuristic cell generators, automatic standard-cell layout generation, megacell/cell-merging approaches, or transistor-level placement/routing
- paper addresses cell-level transistor network synthesis, sizing, or placement
