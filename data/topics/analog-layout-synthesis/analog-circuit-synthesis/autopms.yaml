compare_when:
- evaluating automated design of analog/mixed-signal power management systems from high-level specifications
- comparing hierarchical modeling and design-knowledge-based AMS automation against BO/RL or prior PMU synthesis methods
benchmark_scope:
- multi-output PMS generation with buck, boost, buck-boost, and LDO topologies
- 65 nm technology validation with system/block-level models and netlist verification
- generated PMS examples with multiple output rails and up to seven blocks
metrics:
- design success rate and objective score
- runtime or design-efficiency improvement from hierarchical modeling
- model-netlist discrepancy after design-coefficient feedback
- supported power range, topology coverage, efficiency, transient response, and settling time
reproducibility: paper_only
caveats:
- manual DATE PDF BibTeX is used because publisher/DBLP/Crossref DOI metadata is unresolved
- implementation, PMU library, and technology setup were not verified as public artifacts
- proposed analog-circuit-synthesis currently sits under analog-layout-synthesis as a provisional parent and should be reviewed before Workflow C
- direct comparisons are partly against prior PMU automation works with different technologies and specifications
