- diverse industrial and academic layout patterns
- single-layer and cell-level matching tasks
- complex patterns with geometric tolerances
metrics:
- speedup vs Calibre (up to 201.7x for single-layer, 22.9x for cell-level)
- matching accuracy (100%)
- time complexity (near-linear)
