description: Timing-analysis and simulation methods that propagate dynamic events or waveforms through digital circuits to model delay, glitches, multi-input switching, drafting, or transient timing behavior beyond conventional static timing analysis.
review_triggers:
- paper proposes dynamic timing analysis, event-driven delay simulation, or gate-delay models for dynamic timing effects
- experiments compare against SPICE, inertial delay, degradation/involution delay models, or STA timing models
- metrics include average deviation time, waveform/timing-error accuracy, glitch prediction, or runtime versus analog simulation
