description: Algorithms and tools that decompose layout features across multiple lithography masks, including coloring, conflict minimization, stitch/conflict tradeoffs, and hard/soft spacing-rule handling.
review_triggers:
- Paper proposes or evaluates a layout decomposition/coloring method for double, triple, or multiple patterning.
- Benchmarks include ISCAS, ISPD, OpenMPL, or foundry/commercial-tool layout decomposition cases.
- Metrics include hard conflicts, soft conflicts, stitches, weighted decomposition cost, or decomposition runtime.
