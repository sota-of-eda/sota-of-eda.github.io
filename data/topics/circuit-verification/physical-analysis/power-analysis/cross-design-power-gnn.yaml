- ISCAS85 and EPFL benchmark circuits synthesized with Synopsys Design Compiler and SAED EDK 32 nm library
- zero-delay and SDF-delay gate-level simulation scenarios using VCS and PrimeTime PX ground truth
- training on 10 smaller designs and testing on 5 larger unseen designs with 20000 random input patterns
metrics:
- NRMSE and average power error for cycle-based power traces
- runtime speedup over PrimeTime PX
- comparison against CAPEDL and AL-Power reimplementations
- feature ablation MAPE and R2
