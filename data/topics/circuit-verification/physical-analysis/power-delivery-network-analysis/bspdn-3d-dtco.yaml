compare_when:
- evaluating early-stage IR-drop and power-integrity analysis for 3D ICs with FSPDN/BSPDN choices
- comparing power/thermal DTCO scenarios for Memory-on-Logic and Logic-on-Memory 3D CPU stacking
benchmark_scope:
- commercial-IP-based 7nm 3D CPU design with SRAM area much larger than logic area
- 2D control chip validation against Cadence Voltus plus four 3D scenarios combining MoL/LoM stacking with FSPDN/BSPDN
- thermal simulation using Ansys-based tools and additional DTCO experiments varying micro-TSV count and thermally conductive fill material
metrics:
- 98th-percentile IR drop for logic and SRAM dies
- peak temperature and thermal map comparison across 3D stacking/PDN scenarios
- IR-drop reduction from additional micro-TSVs
- temperature reduction from high-thermal-conductivity material integration
