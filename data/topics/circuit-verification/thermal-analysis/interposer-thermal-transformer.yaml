compare_when:
- evaluating thermal sensor allocation and thermal-map reconstruction for chiplet/interposer systems
- comparing reusable-interposer thermal monitoring methods across known and unseen floorplans
benchmark_scope:
- ten reusable-interposer floorplans generated with gem5, McPAT, HotSpot, and TAP-2.5D
- transformer reconstruction with hyperparameter-tuned sensor locations for 8, 16, 32, and 64 sensors
- known-floorplan and unseen-floorplan scenarios with 79000 thermal-map data points
metrics:
- RMSE and maximum thermal-map reconstruction error
- average MAX error reduction versus FrameSense-PCA, entropy placement with compressed sensing, random placement with compressed sensing, and LASSO
- model memory footprint and inference latency
