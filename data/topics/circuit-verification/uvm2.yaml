compare_when:
- comparing LLM-assisted UVM testbench generation flows for RTL functional verification
- evaluating coverage-driven automatic testbench generation and repair for UVM environments
- benchmarking agent-based verification automation against manual verification-engineer workflows and prior automated approaches
benchmark_scope:
- RTL designs up to about 1.6K lines of code
- UVM testbench generation, simulation repair, and coverage-guided testcase supplement tasks
metrics:
- testbench setup time reduction up to 38.82x compared with experienced engineers
- average code coverage of 87.44%
- average functional coverage of 89.58%
- reported coverage improvements of 20.96% code coverage and 23.51% functional coverage over compared SOTA solutions
reproducibility: unknown
caveats:
- targets UVM-based RTL functional verification rather than full formal or signoff verification
- LLM-generated verification artifacts can still require simulation feedback and guardrails to avoid hallucinated names or protocol errors
- benchmark designs are moderate-size RTL examples, so subsystem- or SoC-scale generality should be reviewed separately
