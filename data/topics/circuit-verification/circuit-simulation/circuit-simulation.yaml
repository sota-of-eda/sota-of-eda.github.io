review_triggers:
- paper claims SPICE or fast-SPICE simulation improvement
- paper addresses transient analysis or nonlinear circuit simulation
- paper proposes GPU-accelerated or parallel circuit simulation
- paper claims improved SPICE-like circuit simulation runtime, convergence, or solver robustness
- paper selects, tunes, or accelerates numerical methods for transistor-level circuit analysis
- experiments report PTA steps, Newton-Raphson iterations, convergence rate, simulation runtime, or accuracy versus SPICE-like baselines
- paper claims improved SPICE-like circuit simulation runtime, convergence, waveform accuracy, or solver robustness
- paper accelerates transistor-level or memory/circuit-level transient, DC, or waveform simulation
- experiments report speedup, waveform/delay error, convergence, simulation runtime, or accuracy versus SPICE-like baselines
- paper accelerates sparse matrix factorization, matrix ordering, or numerical kernels for circuit simulation
- experiments report fill-ins, factorization time, memory, simulation runtime, or accuracy versus SPICE-like or sparse-solver baselines
- paper claims circuit-simulation, SPICE-acceleration, waveform-simulation, or numerical-solver improvement
- experiments compare against SPICE, Spectre, HSPICE, circuit-specific simulators, or sparse solver baselines
- metrics include simulation error, waveform error, convergence, runtime, memory, or design-space exploration throughput
