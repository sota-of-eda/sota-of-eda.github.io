caveats:
- no public code or dataset artifact was verified in this pass
- manual DATE PDF BibTeX is used because publisher/DBLP/Crossref DOI metadata is unresolved
- scope is SRAM waveform/timing simulation; it should not be interpreted as generic timing-driven placement or SRAM compiler SOTA
