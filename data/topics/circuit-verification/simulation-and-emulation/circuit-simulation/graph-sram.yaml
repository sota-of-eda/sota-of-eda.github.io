compare_when:
- evaluating fast transistor-level waveform or timing simulation for SRAM arrays
- comparing graph-learning circuit-simulation surrogates against HSPICE or commercial fast-SPICE SRAM characterization flows
benchmark_scope:
- 150 SRAM circuit netlists with 128-256 rows and 32-64 columns implemented using ASAP7 7nm FinFET PDK
- HSPICE-generated 8-cycle transient waveform labels for SRAM read/write timing paths
- test-set comparison against HSPICE, commercial CustomSim fast-SPICE, GCN, GraphSAGE, and ablation without RC interconnect modeling
metrics:
- cell waveform and delay MAE/MARE
- path waveform MARE, read-delay MARE, and write-delay MARE
- simulation runtime and speedup over fast-SPICE and HSPICE
- error reduction from RC interconnect modeling
