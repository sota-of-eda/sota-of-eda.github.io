compare_when:
- evaluating automatic PTA-method selection for transistor-level DC operating-point analysis
- comparing graph/LLM-assisted circuit-simulation acceleration against default SPICE-like simulator method selection or ML/RL PTA selection
benchmark_scope:
- 164 transistor-level circuits for PTA method selection, with 129 training circuits and 35 test circuits
- four PTA methods evaluated per circuit, where the label is the method with the fewest Newton-Raphson iterations
- commercial SPICE-like simulator C-SPICE used to run PTA simulations and provide the default-method comparison
metrics:
- PTA step speedup versus C-SPICE default PTA method
- Newton-Raphson iteration speedup versus C-SPICE default PTA method
- PTA method selection accuracy, F1-score, precision, and recall
- ablation accuracy for LLM choices, graph encoders, readout strategies, and graph/LLM components
reproducibility: paper_only
caveats:
- no DBLP/Crossref/arXiv/Semantic Scholar exact metadata record or formal DATE/IEEE DOI was found during this pass; BibTeX is manually formatted from the official DATE PDF and marked for human metadata review
- experiments integrate with a commercial SPICE-like simulator and do not provide a verified public artifact in this pass
- classification baselines such as generic LLMs and GNN encoders are ablations; the EDA baseline interpretation should focus on PTA/DC-analysis method selection
