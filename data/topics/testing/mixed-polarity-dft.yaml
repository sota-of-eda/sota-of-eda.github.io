caveats:
- no DBLP/Crossref/Semantic Scholar exact metadata record or formal DATE/IEEE DOI was found during this pass; BibTeX is manually formatted from the official DATE PDF and marked for human metadata review
- no public implementation artifact was found in this pass
- evaluation depends on commercial Synopsys/Cadence tools and a 28 nm technology library, limiting independent reproduction
- the proposed scan-latch structure is implemented as a macro-cell using standard cells; physical design of a dedicated standard cell is left for future work
