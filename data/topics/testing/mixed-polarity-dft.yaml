compare_when:
- evaluating design-for-testability support for latch-based or mixed-polarity flip-flop/latch sequential circuits
- comparing scan-chain compatible time-borrowing methodologies that preserve ATPG and scan-test functionality
benchmark_scope:
- ISCAS89 s15850 and CEP sha256/aes192 benchmark circuits
- 28 nm technology-library experiments with Synopsys Design Compiler, Tetramax ATPG, VCS simulation, Cadence Innovus P&R, and static timing analysis
- designs evaluated with and without DFT and with regular FF versus Mix&Latch-style mixed-polarity latch insertion
metrics:
- maximum achievable clock frequency after P&R
- total area and sequential-cell area
- number of sequential cells
- power consumption
- scan-test functionality and ATPG compatibility
