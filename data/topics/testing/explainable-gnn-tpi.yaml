compare_when:
- evaluating DFT test point insertion for uncontrollable or masked I/Os
- comparing ML/GNN-based test-coverage prediction and saliency-driven testability improvement
benchmark_scope:
- 43 circuits from ISCAS89, ITC99, and OpenLane CI designs synthesized with Design Compiler and Synopsys 32 nm technology
- AIG conversion with Yosys and masked I/O ratios from 0% to 100%
- comparison against Synopsys TMAX ATPG labels and TMAX Advisor TPI baseline
metrics:
- Pearson correlation between predicted and ground-truth test coverage
- number and ratio of inserted test points needed to reach target coverage
- test-coverage improvement under the same test-point budget
reproducibility: paper_only
caveats:
- manual DATE PDF BibTeX is used because publisher/DBLP/Crossref DOI metadata is unresolved
- no public code or dataset repository was verified in this pass
- results depend on commercial Synopsys TMAX/Design Compiler flows and a proprietary 32 nm technology setup
- accepted registry may later split DFT/test-point-insertion from the broad testing root topic
