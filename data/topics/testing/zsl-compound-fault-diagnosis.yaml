- Sallen-Key bandpass filter, four-op-amp biquad high-pass filter, and leapfrog filter diagnostic tasks
- resistor and capacitor tolerance settings of 5% and 10%, with single-fault and double-fault categories
- pseudo-compound fault generation from single-fault data plus similarity-based decision classification
metrics:
- compound-fault classification accuracy across three analog circuits
- average accuracy across circuit diagnostic tasks
- training-epoch accuracy trends for the proposed zero-shot model
