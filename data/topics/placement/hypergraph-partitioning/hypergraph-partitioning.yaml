review_triggers:
- paper claims VLSI hypergraph partitioning quality or runtime improvement
- paper evaluates on ISPD98, ISPD05, DAC/ICCAD partitioning contest, or netlist hypergraph benchmarks
- paper compares cutsize, balance constraints, or partitioning runtime against hMETIS, KaHyPar, SpecPart, MedPart, or GenPart
