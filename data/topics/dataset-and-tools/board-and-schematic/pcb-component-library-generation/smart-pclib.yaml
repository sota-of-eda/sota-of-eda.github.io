compare_when:
- evaluating automated PCB symbol/footprint/component-library generation from datasheets
- comparing domain-specific MLLM agents and DSL-based generation against general-purpose MLLMs or semi-automated PCB library tools
benchmark_scope:
- dataset of more than 3000 PCB component samples with 1160 training samples and 2320 test samples grouped by pin-count difficulty
- multi-agent workflow using Qwen2.5VL-7B LoRA adapters, PyPCLib DSL, OCR, verification, and iterative repair
- evaluation through KiCad 8.0.7 visualization and generated symbol/footprint comparisons
metrics:
- PCC pin/pad count correctness
- NMR pin-name match rate
- DMR dimension match rate for extraction
- POR pad-overlap rate for footprint geometry
- single-case generation time and ablation gains from verification/fix and OCR
reproducibility: paper_only
caveats:
- manual DATE PDF BibTeX is used because publisher/DBLP/Crossref DOI metadata is unresolved
- dataset/artifact availability was not verified in this pass
- topic is board-level EDA library generation, not IC routing, PCB PnR, or general LLM code generation
