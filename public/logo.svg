<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SOTA of EDA logo</title>
  <desc id="desc">A square chip with right-angle circuit traces and a layered golden orbit marker.</desc>
  <defs>
    <linearGradient id="chip-edge" x1="70" y1="64" x2="186" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2C978"/>
      <stop offset=".55" stop-color="#86D7BF"/>
      <stop offset="1" stop-color="#F8F1E7"/>
    </linearGradient>
    <radialGradient id="sphere-fill" cx="35%" cy="28%" r="70%">
      <stop stop-color="#FFF0B8"/>
      <stop offset=".42" stop-color="#F2C978"/>
      <stop offset="1" stop-color="#C98D3F"/>
    </radialGradient>
    <filter id="orbit-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse
    cx="128"
    cy="128"
    rx="108"
    ry="42"
    fill="none"
    stroke="#F2C978"
    stroke-width="7.2"
    stroke-linecap="round"
    opacity=".38"
    transform="rotate(-18 128 128)"
  />

  <rect
    x="76"
    y="76"
    width="104"
    height="104"
    rx="22"
    fill="#10151F"
    stroke="url(#chip-edge)"
    stroke-width="10"
  />

  <g stroke="#86D7BF" stroke-width="5.8" stroke-linecap="round" opacity=".72">
    <path d="M96 66v-12M117 66v-12M139 66v-12M160 66v-12M96 202v-12M117 202v-12M139 202v-12M160 202v-12"/>
    <path d="M66 96H54M66 117H54M66 139H54M66 160H54M202 96h-12M202 117h-12M202 139h-12M202 160h-12"/>
  </g>

  <g fill="none" stroke="#F8F1E7" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 112h23v18h22"/>
    <path d="M151 145h-23v-18h-22"/>
  </g>
  <path
    d="M119 154v-18h19v-25"
    fill="none"
    stroke="#F2C978"
    stroke-width="5.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".95"
  />

  <path
    d="M29.42 141.37 A108 42 -18 0 0 190.60 145.91"
    fill="none"
    stroke="#F2C978"
    stroke-width="7.4"
    stroke-linecap="round"
    filter="url(#orbit-glow)"
  />

  <circle cx="223.86" cy="85.42" r="11" fill="url(#sphere-fill)" filter="url(#orbit-glow)"/>
  <circle cx="220.1" cy="81.7" r="3.1" fill="#FFF6D2" opacity=".9"/>
</svg>
